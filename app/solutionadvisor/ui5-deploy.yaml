specVersion: "3.1"
metadata:
  name: sd.solutionadvisor
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
      - "**/*.md"
      - ".eslintrc"
      - ".ui5lintrc.json"
      - "tsconfig.json"
      - ".appGenInfo.json"
      - "package-lock.json"
      - "node_modules/**"
  minification:
    excludes:
      - "webapp/libs/**"
  componentPreload:
    paths:
      - webapp/
    namespaces:
      - sd.solutionadvisor
  customTasks:
  - name: ui5-task-zipper
    afterTask: generateCachebusterInfo
    configuration:
      archiveName: solutionadvisor
      additionalFiles:
      - xs-app.json