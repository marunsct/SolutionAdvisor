specVersion: "3.1"
metadata:
  name: sd.solutionadvisor
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
      - "**/*.md"
      - ".eslintrc"
      - ".ui5lintrc.json"
      - "tsconfig.json"
      - ".appGenInfo.json"
      - "package-lock.json"
      - "node_modules/**"
  minification:
    excludes:
      - "webapp/libs/**"
  componentPreload:
    paths:
      - webapp/
    namespaces:
      - sd.solutionadvisor
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
        - path: /service
          url: http://localhost:4004
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sapui5.hana.ondemand.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
