_schema-version: 3.3.0
ID: SolutionAdvisor
description: Solution Advisor
version: 1.0.0
modules:
  - name: SolutionAdvisor-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: SolutionAdvisor-auth
      - name: SolutionAdvisor-sm1
      - name: SolutionAdvisor-alerts
      - name: SolutionAdvisor-logging
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
  - name: SolutionAdvisor-mtx
    type: nodejs
    path: gen/mtx/sidecar
    requires:
      - name: SolutionAdvisor-auth
      - name: SolutionAdvisor-sm1
      - name: SolutionAdvisor-registry
      - name: app-api
        properties:
          SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-~{app-uri}
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    hooks:
      - name: upgrade-all
        type: task
        phases:
          - blue-green.application.before-start.idle
          - deploy.application.before-start
        parameters:
          name: upgrade
          memory: 512M # increase as required
          disk-quota: 768M # increase as required
          command: cds-mtx upgrade '*'
  - name: solutionadvisor-approuter
    type: approuter.nodejs
    path: app
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api
          url: ~{mtx-url}
          forwardAuthToken: true
      - name: SolutionAdvisor-auth
      - name: SolutionAdvisor_html_repo_runtime
      - name: SolutionAdvisor-dest
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
    provides:
      - name: app-api
        properties:
          url: ${default-url}
          domain: ${domain}
          app-protocol: ${protocol} # Multitenant
          app-uri: ${default-uri} # Multitenant
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 512M
      memory: 512M
      keep-existing-routes: true
    build-parameters:
      builder: npm-ci
  - name: SolutionAdvisor_ui_deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: SolutionAdvisor_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: solutionadvisor
          artifacts:
            - solutionadvisor.zip
          target-path: resources/
  - name: solutionadvisor
    type: html5
    path: app/solutionadvisor
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: SolutionAdvisor-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: shared
        xsappname: SolutionAdvisor-${space}
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api
  - name: SolutionAdvisor-sm1
    type: org.cloudfoundry.managed-service
    parameters:
      service: service-manager
      service-plan: container
  - name: SolutionAdvisor-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: mtx-api
      - name: SolutionAdvisor-auth
      - name: app-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        appName: SolutionAdvisor
        xsappname: SolutionAdvisor-${space}
        appUrls:
          getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
          onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          callbackTimeoutMillis: 600000
          # Add the application launch URL property below:
          app: https://{tenantId}-~{app-api/app-uri}
          onUpdateDependenciesAsync: true
        displayName: SolutionAdvisor
        description: A simple CAP project.
        category: 'Category'
  - name: SolutionAdvisor_html_repo_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: SolutionAdvisor_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: SolutionAdvisor-alerts
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: SolutionAdvisor-alerts
  - name: SolutionAdvisor-dest
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-plan: lite
  - name: SolutionAdvisor-logging
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: SolutionAdvisor-logging
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
