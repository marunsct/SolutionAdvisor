_schema-version: 3.3.0
ID: SolutionAdvisor
description: Solution Advisor
version: 1.0.0
modules:
- name: SolutionAdvisor-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: SolutionAdvisor-auth
  - name: SolutionAdvisor-db
  - name: SolutionAdvisor-alerts
  - name: SolutionAdvisor-logging
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: SolutionAdvisor-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: SolutionAdvisor-db
  parameters:
    buildpack: nodejs_buildpack
- name: solutionadvisor-approuter
  type: approuter.nodejs
  path: app
  requires:
  - name: SolutionAdvisor_html_repo_runtime
  - name: SolutionAdvisor-auth
  parameters:
    disk-quota: 1024M
    memory: 1024M
- name: SolutionAdvisor_ui_deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: SolutionAdvisor_html_repo_host
    parameters:
      content-target: true
resources:
- name: SolutionAdvisor-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: SolutionAdvisor-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: SolutionAdvisor-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: SolutionAdvisor_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: SolutionAdvisor_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: SolutionAdvisor-alerts
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: SolutionAdvisor-alerts
- name: SolutionAdvisor-logging
  type: org.cloudfoundry.managed-service
  parameters:
    service: application-logs
    service-plan: lite
    config:
      retention-period: 7
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
